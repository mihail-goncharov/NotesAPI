name: CI

on: [push, pull_request]

jobs:
  build:

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: NotesApiTest
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Test with pytest
        run: pytest app/testing --cov=app
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/notesapi
          DATABASE_URL_TEST: postgresql+psycopg2://postgres:postgres@localhost:5432/NotesApiTest
          SECRET_KEY: qawsedrftgyh
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: 30

